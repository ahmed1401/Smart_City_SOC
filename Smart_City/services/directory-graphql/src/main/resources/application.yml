server:
  port: ${PORT:8082}

spring:
  application:
    name: directory-service
  datasource:
    url: ${DIRECTORY_DB_URL:jdbc:postgresql://localhost:5434/directory}
    username: ${DIRECTORY_DB_USERNAME:directory}
    password: ${DIRECTORY_DB_PASSWORD:directory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  graphql:
    schema:
      locations: classpath:/graphql/
      file-extensions: .graphql
    path: /graphql
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
